<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>KANTAN Play clone</title>
<style>
  :root { --bg:#fff; --fg:#111; --key:#2b1d1a; --pad:#ee9955; --btn:#e6e6e6; --active:#ee9955; --sel:#6cc; }
  * { box-sizing:border-box; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif; }
  .wrap { display:flex; flex-wrap:wrap; gap:24px; justify-content:center; padding:16px; }
  .player { width:600px; max-width:100%; display:grid; gap:10px; align-content:start; }
  .outrow input[type=range] { vertical-align:middle; width:140px; }
  .drumbtn { font-size:14px; padding:5px 14px; border:2px solid #444; border-radius:16px; background:#fff; cursor:pointer; font-weight:700; }
  .drumbtn.on { background:var(--pad); border-color:var(--pad); color:#fff; }
  .row { display:grid; gap:10px; }
  .keyrow { grid-template-columns:90px 80px 1fr 80px; align-items:center; }
  .logo { font-weight:900; font-size:18px; line-height:1.1; color:var(--pad); letter-spacing:-1px; }
  .keybtn { height:76px; background:#555; color:#fff; font-size:30px; border:none; border-radius:6px; cursor:pointer; }
  .keydisp { height:76px; background:var(--btn); display:flex; align-items:center; justify-content:center; gap:12px; font-size:30px; font-weight:800; border-radius:4px; }
  .keydisp small { font-size:16px; font-weight:500; }
  .instrow { grid-template-columns:1fr 80px; }
  .instdisp { height:76px; background:var(--btn); display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:700; border-radius:4px; cursor:pointer; }
  .instsel { height:76px; background:var(--btn); font-size:28px; border:none; border-radius:4px; cursor:pointer; }
  .patrow { grid-template-columns:repeat(7,1fr); }
  .pat { height:64px; padding:2px; background:#fff; border:3px solid #444; border-radius:4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; gap:4px; }
  .pat.active { border-color:var(--active); background:#fff3e8; }
  .pat .dots { display:grid; grid-template-columns:repeat(8,6px); gap:2px; }
  .pat .dots i { width:6px; height:6px; background:#ddd; border-radius:1px; }
  .pat .dots i.on { background:var(--pad); }
  .arprow { grid-template-columns:repeat(5,1fr); }
  .arp { height:56px; background:#fff; border:3px solid #999; border-radius:4px; cursor:pointer; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(6,1fr) 1.3fr; gap:2px; padding:4px 6px; }
  .arp.active { background:#000; border-color:#000; }
  .arp i { display:block; border-radius:1px; }
  .main { grid-template-columns:1fr 1fr 1fr 130px; grid-template-rows:repeat(3,110px); }
  .deg { background:var(--key); color:#fff; border:none; border-radius:4px; font-size:44px; font-weight:800; position:relative; cursor:pointer; }
  .deg small { position:absolute; left:8px; bottom:6px; font-size:18px; font-weight:600; }
  .deg.on, .deg:active { background:var(--active); color:#222; }
  .deg.shift.on { background:var(--sel); }
  .deg.hit, .mod.hit { background:#fff; color:var(--pad); box-shadow:0 0 0 4px var(--pad) inset; }
  .pad { grid-row:1 / span 3; grid-column:4; background:var(--pad); border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:44px; color:#fff; cursor:pointer; }
  .pad.on { background:var(--sel); color:#222; }
  .modrow { grid-template-columns:repeat(5,1fr); }
  .mod { height:76px; background:var(--btn); border:none; border-radius:4px; font-size:30px; font-weight:700; color:#555; cursor:pointer; }
  .mod.on { background:var(--active); color:#222; }
  .outrow { text-align:center; font-size:14px; color:#555; } .outrow select { font-size:14px; padding:4px; }
  .now { text-align:center; font-size:22px; min-height:30px; }
  .now b { font-size:28px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="player">
    <div class="row keyrow">
      <div class="logo">KANTAN<br>clone</div>
      <button class="keybtn" id="keyDown">♭</button>
      <div class="keydisp"><small>Key</small><span id="keyName">C/Am</span></div>
      <button class="keybtn" id="keyUp">♯</button>
    </div>
    <div class="row instrow">
      <div class="instdisp" id="instName">Ac.Guitar</div>
      <select class="instsel" id="instSel"></select>
    </div>
    <div class="row patrow" id="patrow"></div>
    <div class="row arprow" id="arprow"></div>
    <div class="row main" id="main">
      <button class="deg" data-deg="7">7<small></small></button>
      <button class="deg shift" data-shift="-1">♭</button>
      <button class="deg shift" data-shift="1">♯</button>
      <div class="pad" id="pad" title="押している間 メジャー↔マイナー入れ替え">〜</div>
      <button class="deg" data-deg="4">4<small></small></button>
      <button class="deg" data-deg="5">5<small></small></button>
      <button class="deg" data-deg="6">6<small></small></button>
      <button class="deg" data-deg="1">1<small></small></button>
      <button class="deg" data-deg="2">2<small></small></button>
      <button class="deg" data-deg="3">3<small></small></button>
    </div>
    <div class="row modrow" id="modrow">
      <button class="mod" data-mod="dim">dim</button>
      <button class="mod" data-mod="sus4">sus4</button>
      <button class="mod" data-mod="9">9</button>
      <button class="mod" data-mod="7">7</button>
      <button class="mod" data-mod="M7">M7</button>
    </div>
    <div class="now"><span id="nowChord">—</span> &nbsp; <span id="nowBpm"></span></div>
    <div class="outrow"><button class="drumbtn" id="drumBtn">ドラム</button> <label><select id="drumPatSel"></select></label> &nbsp; <label>テンポ <input type="range" id="bpmSl" min="40" max="220" value="100"></label> &nbsp; <label>オクターブ <select id="octSel"><option value="-2">-2</option><option value="-1">-1</option><option value="0" selected>0</option><option value="1">+1</option><option value="2">+2</option></select></label></div>
    <div class="outrow"><label>ストローク <select id="strumSel"></select></label> &nbsp; <label>自動アルペジオ <select id="arpSel"></select></label> &nbsp; <label>自動ベース <select id="bassSel"></select></label></div>
    <div class="outrow"><label>ベース音色 <select id="bassProgSel"></select></label> &nbsp; <label>手弾きベース <select id="bassStyleSel"></select></label> &nbsp; <label>ベースオクターブ <select id="bassOctSel"><option value="-1">-1</option><option value="0" selected>0</option><option value="1">+1</option></select></label></div>
    <div class="outrow"><label>MIDI 出力 <select id="midiSel"><option value="">内蔵音源 (soundfont)</option></select></label> <span id="midiStatus"></span></div>
    <div class="outrow"><label>MIDI 入力 <select id="midiInSel"><option value="">なし</option></select></label> <span class="small" style="font-size:12px;color:#888">白鍵 C〜B → 1〜7、黒鍵 → ♯ 付き</span></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>

// ---------- 音楽理論 (本家のテーブルで 6 弦のボイシングを引く) ----------
const NOTE_NAMES = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const RELATIVE_MINOR = t => NOTE_NAMES[(t + 9) % 12] + 'm';
const VOICING = { CLOSE: 0, GUITAR: 1 };
function chordName(root, minor, mod) {
  const n = NOTE_NAMES[root % 12], q = minor ? 'm' : '';
  if (mod === 'dim') return n + 'dim';
  if (mod === 'sus4') return n + 'sus4';
  if (mod === '9') return n + q + 'add9';
  if (mod === '7') return n + q + '7';
  if (mod === 'M7') return n + (minor ? 'mM7' : 'M7');
  return n + q;
}
// KantanMusic.get_midi_note_number と同じ手順。key 0..11、deg 1..7、shift -1/0/1、swap = 〜 (メジャー↔マイナー)
function buildChord(key, deg, shift, mod, swap, voicing, octave) {
  const idx = key * 9 + (deg - 1);
  const root = (CHORD_ROOT_TABLE[idx] + shift + 12) % 12;
  let minor = !!MINOR_FLAG_TABLE[idx];
  if (shift !== 0) minor = false;          // 半音シフトしたコードはメジャー扱い
  if (swap) minor = !minor;
  const m = MODIFIER[mod || 'none'], mi = minor ? MINOR_MOD_MAP[m] : m;
  const base = voicing * 12 * 16 * 7 + root * 16 * 7 + mi * 7;
  const midi = [1, 2, 3, 4, 5, 6].map(p => NOTE_TABLE[base + p] + octave * 12);
  return { name: chordName(root, minor, mod), midi, root, minor };
}

  guitar:  { label: 'Ac.Guitar', sf: 'acoustic_guitar_steel', gm: 25, voicing: VOICING.GUITAR },
  piano:   { label: 'Piano', sf: 'acoustic_grand_piano', gm: 0, voicing: VOICING.CLOSE },
  epiano:  { label: 'E.Piano', sf: 'electric_piano_1', gm: 4, voicing: VOICING.CLOSE },
  strings: { label: 'Strings', sf: 'string_ensemble_1', gm: 48, voicing: VOICING.CLOSE },
  organ:   { label: 'Organ', sf: 'drawbar_organ', gm: 16, voicing: VOICING.CLOSE },
  brass:   { label: 'Brass', sf: 'brass_section', gm: 61, voicing: VOICING.CLOSE },
  square:  { label: 'Square Wave', sf: 'lead_1_square', gm: 80, voicing: VOICING.CLOSE },   // GM 81 Lead 1 (square)
};

// ---------- オーディオ ----------
// 音源は全部 play(midi, time, {gain, duration}) → { stop(when) } のインターフェースに揃える
const ac = new (window.AudioContext || window.webkitAudioContext)();
const unlock = () => { if (ac.state !== 'running') ac.resume(); };
['pointerdown','keydown','touchstart','click'].forEach(ev => window.addEventListener(ev, unlock, { capture: true }));
const master = ac.createGain(); master.gain.value = 1.0; master.connect(ac.destination);
let inst = null, instId = 'guitar';
// soundfont-player のラッパ (play の戻り値に stop(when) がある)
const sfInst = (sf) => ({ play(m, t, o) { const n = sf.play(m, t, { gain: o.gain, duration: o.duration }); return { stop: (w) => { try { n.stop(w); } catch (e) {} } }; } });
// soundfont が読めない時のフォールバック (単純な減衰オシレータ)
const oscInst = (type, peak, filter) => ({ play(m, t, o) {
  const f = 440 * Math.pow(2, (m - 69) / 12), g = ac.createGain(), osc = ac.createOscillator();
  osc.type = type; osc.frequency.value = f;
  if (filter) { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = filter; osc.connect(lp); lp.connect(g); } else osc.connect(g);
  g.connect(master);
  const end = t + (o.duration || 1);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime((o.gain || 1) * peak, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, end); osc.start(t); osc.stop(end + 0.05);
  return { stop(w) { g.gain.cancelScheduledValues(w); g.gain.setValueAtTime(g.gain.value, w); g.gain.exponentialRampToValueAtTime(0.0001, w + 0.03); osc.stop(w + 0.05); } };
} });
const synth = oscInst('triangle', 0.25), bassSynth = oscInst('sawtooth', 0.5, 500);

// ---------- Web MIDI ----------
// チャンネル: コードの 6 弦 → ch1〜6 (弦ごとに 1 音 1ch)、ベース → ch7、ドラム → ch10
const midi = { access: null, out: null, in: null, chordCh: [0, 1, 2, 3, 4, 5], bassCh: 6, drumCh: 9,
  toMs(t) { return performance.now() + (t - ac.currentTime) * 1000; },   // AudioContext 時刻 → DOMHighResTimeStamp
  vel(g, k) { return Math.max(1, Math.min(127, Math.round((g || 1) * k))); },
  serial: 0, latest: new Map(),          // (ch, note) → 最後に鳴らした発音の id。古い Note Off が新しい音を消さないようにする
  note(ch, m, t, o) {
    const out = this.out, key = ch * 128 + m, id = ++this.serial;
    if (this.latest.has(key)) out.send([0x80 | ch, m, 0], this.toMs(t));   // 同じ ch・音がまだ鳴っていたら先に切ってから弾き直す
    this.latest.set(key, id);
    out.send([0x90 | ch, m, this.vel(o.gain, 105)], this.toMs(t));
    let timer = null, done = false;
    const off = (when) => {               // when 時刻に Note Off。その間に同じ ch・音が弾き直されていたら送らない
      clearTimeout(timer);
      timer = setTimeout(() => { if (this.latest.get(key) === id) { this.latest.delete(key); if (this.out === out) out.send([0x80 | ch, m, 0]); } }, Math.max(0, (when - ac.currentTime) * 1000));
    };
    off(t + (o.duration || 1));
    return { stop: (w) => { if (done) return; done = true; off(w); } };
  },
  play(m, t, o) { return this.note(this.chordCh[(o.ch || 0) % 6], m, t, o); },   // o.ch = 弦番号 0..5
  drum(note, t, vel) {
    if (!this.out) return false;
    this.out.send([0x90 | this.drumCh, note, this.vel(vel, 115)], this.toMs(t));
    this.out.send([0x80 | this.drumCh, note, 0], this.toMs(t + 0.1));
    return true;
  },
  program(gm) { if (this.out) { for (const ch of this.chordCh) this.out.send([0xC0 | ch, gm]); this.out.send([0xC0 | this.bassCh, BASS_PROGRAMS[state.bassProg].gm]); } },
  allOff(out = this.out) { this.latest.clear(); if (!out) return; for (let ch = 0; ch < 16; ch++) { out.send([0xB0 | ch, 123, 0]); out.send([0xB0 | ch, 120, 0]); } },   // 全 16ch All Notes Off + All Sound Off
};
midi.bassOut = { play(m, t, o) { return midi.note(midi.bassCh, m, t, o); } };
// MIDI 入力: 白鍵 C D E F G A B → 度数 1〜7、黒鍵 → 下の白鍵に ♯。押す/離すでアルペジオが進む。ベロシティで強弱
const PC_TO_DEG = { 0: [1, 0], 1: [1, 1], 2: [2, 0], 3: [2, 1], 4: [3, 0], 5: [4, 0], 6: [4, 1], 7: [5, 0], 8: [5, 1], 9: [6, 0], 10: [6, 1], 11: [7, 0] };
const midiHeld = new Map();
function onMidiIn(e) {
  const [st, note, vel] = e.data, cmd = st & 0xf0;
  if (cmd === 0x90 && vel > 0) {
    const [deg, shift] = PC_TO_DEG[note % 12];
    ac.resume(); setShift(shift); midiHeld.set(note, deg); pressDeg(deg, vel / 100);
  } else if (cmd === 0x80 || (cmd === 0x90 && vel === 0)) {
    const deg = midiHeld.get(note); midiHeld.delete(note);
    if (deg) releaseDeg(deg);
  }
}
async function initMidi() {
  const sel = document.getElementById('midiSel'), st = document.getElementById('midiStatus'), inSel = document.getElementById('midiInSel');
  if (!navigator.requestMIDIAccess) { st.textContent = '(このブラウザは Web MIDI 非対応)'; return; }
  try { midi.access = await navigator.requestMIDIAccess(); } catch (e) { st.textContent = '(MIDI アクセス拒否)'; return; }
  for (const o of midi.access.outputs.values()) midi.allOff(o);     // 起動時: 全出力の全チャンネルをノートオフ (前回の鳴りっぱなし対策)
  const refresh = () => {
    const cur = sel.value; sel.length = 1;
    for (const o of midi.access.outputs.values()) sel.add(new Option(o.name, o.id));
    sel.value = [...sel.options].some(x => x.value === cur) ? cur : '';
    const curIn = inSel.value; inSel.length = 1;
    for (const i of midi.access.inputs.values()) inSel.add(new Option(i.name, i.id));
    inSel.value = [...inSel.options].some(x => x.value === curIn) ? curIn : '';
  };
  const restore = () => {           // 保存したポートが (後から) 見つかったら選び直す
    if (!midi.out && prefs.midiOut && [...sel.options].some(x => x.value === prefs.midiOut)) { sel.value = prefs.midiOut; sel.onchange(); }
    if (!midi.in && prefs.midiIn && [...inSel.options].some(x => x.value === prefs.midiIn)) { inSel.value = prefs.midiIn; inSel.onchange(); }
  };
  midi.access.onstatechange = () => { refresh(); restore(); };
  inSel.onchange = () => {
    savePref('midiIn', inSel.value);
    if (midi.in) midi.in.onmidimessage = null;
    midi.in = midi.access.inputs.get(inSel.value) || null;
    if (midi.in) midi.in.onmidimessage = onMidiIn;
  };
  sel.onchange = () => {
    savePref('midiOut', sel.value);
    stopHeld(ac.currentTime); midi.allOff();
    midi.out = midi.access.outputs.get(sel.value) || null;
    if (midi.out) { midi.allOff(); midi.program(INSTRUMENTS[instId].gm); inst = midi; bass = midi.bassOut; st.textContent = 'MIDI ch1〜6 (弦ごと) / bass ch7 / drums ch10'; }
    else { st.textContent = ''; loadInstrument(instId); loadBass(); }
  };
  refresh(); restore();
}
async function loadInstrument(id) {
  instId = id; savePref('instrument', id);
  const nameEl = document.getElementById('instName');
  nameEl.textContent = INSTRUMENTS[id].label + ' …';
  document.getElementById('instSel').value = id;
  setArpSet(INSTRUMENTS[id].voicing);      // 本家: Gt スタイルはアルペジオ 1〜5、Pf スタイルは 6〜10
  updateChord();
  if (midi.out) { midi.program(INSTRUMENTS[id].gm); inst = midi; nameEl.textContent = INSTRUMENTS[id].label; return; }
  try {
    if (typeof Soundfont === 'undefined') throw new Error('soundfont-player not loaded');
    inst = sfInst(await Soundfont.instrument(ac, INSTRUMENTS[id].sf, { soundfont: 'FluidR3_GM', destination: master }));
    nameEl.textContent = INSTRUMENTS[id].label;
  } catch (e) {
    console.error('soundfont load failed, using synth', e);
    inst = synth; nameEl.textContent = INSTRUMENTS[id].label + ' (synth)';
  }
}
// 人間が弾いている風のゆらぎ: 発音タイミング・強さ・ストロークの速さを毎回少しばらつかせる (自動演奏用)
const HUMAN = { time: 0.014, vel: 0.15, strum: [0.008, 0.022] };
const jitter = (w) => (Math.random() + Math.random() - 1) * w;          // 三角分布 (中央寄り)
const hVel = (v) => Math.max(0.1, Math.min(1.5, v * (1 + jitter(HUMAN.vel))));
function strum(chord, t, dir, vel, dur) {
  if (!inst || !chord) return;
  const idx = dir === 'u' ? [5, 4, 3, 2] : [0, 1, 2, 3, 4, 5];   // 弾く弦 (chord.midi のインデックス)
  const spread = HUMAN.strum[0] + Math.random() * (HUMAN.strum[1] - HUMAN.strum[0]);
  const t0 = Math.max(ac.currentTime, t + jitter(HUMAN.time)), v = hVel(vel);
  idx.forEach((k, i) => inst.play(chord.midi[k], t0 + i * spread, { gain: v * (dir === 'u' ? 0.7 : 1) * (1 + jitter(0.08)), duration: dur, ch: k }));
}
function arp(chord, pos, t, vel, dur) {
  if (!inst || !chord) return;
  const seq = ARPEGGIOS[state.arp].seq, idx = seq[pos % seq.length];
  inst.play(chord.midi[idx % 6], Math.max(ac.currentTime, t + jitter(HUMAN.time)), { gain: hVel(vel), duration: dur, ch: idx % 6 });
}
// ベース (自動演奏)
let bass = null;
async function loadBass() {
  if (midi.out) { bass = midi.bassOut; return; }
  const id = state.bassProg;
  try { const sf = sfInst(await Soundfont.instrument(ac, BASS_PROGRAMS[id].sf, { soundfont: 'FluidR3_GM', destination: master })); if (id === state.bassProg && !midi.out) bass = sf; }
  catch (e) { console.error('bass soundfont load failed, using synth', e); bass = bassSynth; }
}
function bassNote(chord, iv, t, vel, dur) {          // iv = ルートからの半音
  if (!bass || !chord) return;
  let m = 36 + chord.root + iv;                          // C2 付近
  while (m > 47) m -= 12;
  bass.play(m, Math.max(ac.currentTime, t + jitter(0.006)), { gain: hVel(vel), duration: dur });
}
function bassStep(s, p, ev, t, v) {
  const chord = state.chord; if (!chord) return;
  const perBeat = p.steps.length / p.beats, sd = stepDur();
  const third = chord.minor ? 3 : 4;
  switch (state.bass) {
    case 'long':   if (s === 0) bassNote(chord, 0, t, v, sd * p.steps.length); break;
    case 'root':   if (ev.k) bassNote(chord, 0, t, v, sd * 4); break;
    case 'alt':    if (ev.k) bassNote(chord, (kickCount++ % 2) ? 7 : 0, t, v, sd * 4); break;
    case 'walk':   if (s % perBeat === 0) bassNote(chord, [0, third, 7, 9][(s / perBeat) % 4], t, v * 0.9, sd * perBeat * 0.9); break;
    case 'octave': if (s % 2 === 0) bassNote(chord, (s / 2) % 2 ? 12 : 0, t, v * (s % perBeat === 0 ? 1 : 0.8), sd * 1.6); break;
  }
}
// シンプルなシンセドラム
function drum(kind, t, vel) {
  if (midi.drum({ k: 36, s: 38, h: 42 }[kind], t, vel)) return;
  const g = ac.createGain(); g.connect(master);
  if (kind === 'k') {
    const o = ac.createOscillator(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25); o.connect(g); o.start(t); o.stop(t + 0.3);
  } else {
    const buf = ac.createBuffer(1, ac.sampleRate * 0.2, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = kind === 'h' ? 'highpass' : 'bandpass'; f.frequency.value = kind === 'h' ? 8000 : 1800;
    const len = kind === 'h' ? 0.04 : 0.15;
    g.gain.setValueAtTime(vel * (kind === 'h' ? 0.35 : 0.6), t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    src.connect(f); f.connect(g); src.start(t); src.stop(t + len + 0.02);
  }
}

// ---------- 設定の保存 (localStorage) ----------
const PREF_KEY = 'kantan-play-clone';
const prefs = (() => { try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch (e) { return {}; } })();
function savePref(k, v) { prefs[k] = v; try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} }

// ---------- 状態 ----------
const state = { key: 0, deg: null, shift: 0, mod: null, swap: false, octave: 0, pattern: 'manual', bpm: 100, vel: 1.0, chord: null, arp: 'updown', bass: 'alt', strum: 'folk', bassProg: 'acoustic', bassStyle: 'root', bassOct: 0, drums: false, drumPat: 'eight' };
const voicing = () => INSTRUMENTS[instId].voicing;
function updateChord() {
  state.chord = state.deg ? buildChord(state.key, state.deg, state.shift, state.mod, state.swap, voicing(), state.octave) : null;
  document.getElementById('nowChord').innerHTML = state.chord ? `<b>${state.chord.name}</b>` : '—';
}
function renderKey() {
  document.getElementById('keyName').textContent = NOTE_NAMES[state.key] + '/' + RELATIVE_MINOR(state.key);
  document.querySelectorAll('.deg[data-deg]').forEach(b => {   // 本家 _set_button_name: 〜 を押している間は m を付け外し
    b.querySelector('small').textContent = buildChord(state.key, +b.dataset.deg, 0, null, state.swap, 0, 0).name;
  });
}
function setKey(k) { state.key = (k + 12) % 12; arpReset(); renderKey(); updateChord(); savePref('key', state.key); }
function setPattern(id) {
  state.pattern = id;
  document.querySelectorAll('.pat').forEach(p => p.classList.toggle('active', p.dataset.pat === id));
}
function setMod(mod) {
  state.mod = mod;
  document.querySelectorAll('.mod').forEach(b => b.classList.toggle('on', b.dataset.mod === mod));
  updateChord();
}
function setShift(s) {
  if (state.shift !== s) arpReset();
  state.shift = s;
  document.querySelectorAll('.deg.shift').forEach(b => b.classList.toggle('on', +b.dataset.shift === s));
  updateChord();
}
function setSwap(on) {
  if (state.swap === on) return;
  state.swap = on; arpReset();
  document.getElementById('pad').classList.toggle('on', on);
  renderKey(); updateChord();
}
function setDeg(d) {
  state.deg = d;
  document.querySelectorAll('.deg[data-deg]').forEach(b => b.classList.toggle('on', +b.dataset.deg === d));
  updateChord();
}
function setBpm(b) { state.bpm = b; document.getElementById('nowBpm').textContent = '♩=' + b; document.getElementById('bpmSl').value = b; savePref('bpm', b); }
function setArp(id) { state.arp = id; document.getElementById('arpSel').value = id; savePref('arp', id); }
function setBass(id) { state.bass = id; document.getElementById('bassSel').value = id; savePref('bass', id); }
function setStrum(id) { state.strum = id; document.getElementById('strumSel').value = id; savePref('strum', id); }
function setBassProg(id) { state.bassProg = id; document.getElementById('bassProgSel').value = id; savePref('bassProg', id); if (midi.out) midi.program(INSTRUMENTS[instId].gm); else loadBass(); }
function setBassStyle(id) { state.bassStyle = id; document.getElementById('bassStyleSel').value = id; savePref('bassStyle', id); }
function setBassOct(o) { state.bassOct = o; document.getElementById('bassOctSel').value = o; savePref('bassOct', o); }
function setOctave(o) { state.octave = o; document.getElementById('octSel').value = o; updateChord(); savePref('octave', o); }

// ---------- 手弾きアルペジオ (本家 arpeggiator.gd + coroutine_play の移植) ----------
// パターンは 6 弦 × 8 ステップ。コードボタンを「押す」「離す」たびに 1 ステップ進み、その列で印の付いた弦を弾く
// type 行: BLANK=何もしない(離した時ここに来たら先頭へ戻る) / SAME=同時 / UP=低い弦から / DOWN=高い弦から / MUTE=消音
const arpEng = { set: 0, cur: 0, step: 0, lastDeg: -1 };
const arpPattern = (i) => ({ rows: TABLE_ARP.slice(i * 7, i * 7 + 6), types: TABLE_ARP[i * 7 + 6] });
function arpReset() { arpEng.step = 0; }
function arpNext(released) {
  const p = arpPattern(arpEng.cur);
  arpEng.step++; if (arpEng.step >= 8) arpEng.step = 0;
  if (p.types[arpEng.step] === ARP_TYPE.BLANK && released) arpEng.step = 0;
}
function arpStroke(released) {           // → 弾く弦 (pitch 1..6、1 が低い弦)
  const p = arpPattern(arpEng.cur);
  if (released && arpEng.step === 0) return [];
  const s = [];
  for (let str = 0; str < 6; str++) if (p.rows[str][arpEng.step]) s.push(6 - str);
  if (p.types[arpEng.step] === ARP_TYPE.UP) s.reverse();
  arpNext(released);
  return s;
}
const held = new Map();                  // pitch → { h: 音源ハンドル, t: 発音時刻 }。ベースは pitch 'b0' / 'b1'
function stopHeld(when, pitches) {
  for (const [p, v] of held) if (!pitches || pitches.includes(p)) { v.h.stop(Math.max(when, v.t + 0.3)); held.delete(p); }   // 最低 0.3 秒は鳴らす (本家 delay_2)
}
let bassAlt = 0;
function manualBass(chord, t, vel) {     // 手弾きベース: ch2 (内蔵ならベース音色) でルートを鳴らす
  if (!bass || state.bassStyle === 'off') return;
  const root = 36 + chord.root + state.bassOct * 12;   // C2 付近
  const notes = state.bassStyle === 'root' ? [root] : state.bassStyle === 'both' ? [root, root + 12] : [root + 12 * (bassAlt++ % 2)];
  notes.forEach((m, i) => { const k = 'b' + i; stopHeld(t, [k]); held.set(k, { h: bass.play(m, t, { gain: vel, duration: 3.8, hold: true }), t }); });
}
function manualPlay(deg, released, vel) {
  if (arpEng.lastDeg !== deg) { arpEng.lastDeg = deg; arpReset(); }
  const p = arpPattern(arpEng.cur), type = p.types[arpEng.step];
  const group = arpStroke(released);
  if (type === ARP_TYPE.MUTE) { stopHeld(ac.currentTime); return; }
  const chord = state.chord; if (!inst || !chord || !group.length) return;
  const delay = (voicing() === VOICING.GUITAR && type !== ARP_TYPE.SAME) ? 0.007 : 0.0001;   // 本家 delay_1
  const t0 = ac.currentTime + 0.005;
  if (!released) manualBass(chord, t0, vel);   // 押すたびにベース (離すと止まる)
  group.forEach((pitch, i) => {
    const t = t0 + i * delay;
    stopHeld(t, [pitch]);                 // 同じ弦を弾き直す時は前の音を止める
    held.set(pitch, { h: inst.play(chord.midi[pitch - 1], t, { gain: vel, duration: 3.8, hold: true, ch: pitch - 1 }), t });
  });
  flashButtons();
}
const pressed = new Set();
function pressDeg(deg, vel = state.vel) {
  if (pressed.has(deg)) return; pressed.add(deg);
  ac.resume(); setDeg(deg);
  if (state.pattern === 'manual') manualPlay(deg, false, vel);
}
function releaseDeg(deg) {
  if (!pressed.delete(deg)) return;
  if (state.pattern === 'manual') { manualPlay(deg, true, state.vel); stopHeld(ac.currentTime); }   // 離したらノートオフ
}
// アルペジオ選択 (本家 F1〜F5)。ギター系は 0〜4、ピアノ系は 5〜9
function setArpSet(v) { arpEng.set = v === VOICING.GUITAR ? 0 : 5; arpEng.cur = arpEng.set + (arpEng.cur % 5); arpReset(); renderArps(); }
function changeArp(no) { arpEng.cur = arpEng.set + no; arpReset(); renderArps(); savePref('arpNo', no); }
function renderArps() {
  const row = document.getElementById('arprow'); row.innerHTML = '';
  for (let n = 0; n < 5; n++) {
    const i = arpEng.set + n, p = arpPattern(i), el = document.createElement('div');
    el.className = 'arp' + (i === arpEng.cur ? ' active' : ''); el.title = `アルペジオ ${n + 1} (F${n + 1})`;
    let h = '';
    for (let str = 0; str < 6; str++) for (let s = 0; s < 8; s++) h += `<i style="background:${p.rows[str][s] && p.types[s] ? ARP_DOT_COLOR : 'transparent'}"></i>`;
    for (let s = 0; s < 8; s++) h += `<i style="background:${p.types[s] ? ARP_TYPE_COLOR[p.types[s]] : 'transparent'}"></i>`;
    el.innerHTML = h;
    el.onpointerdown = () => { ac.resume(); changeArp(n); };
    row.appendChild(el);
  }
}

// ---------- シーケンサ (自動演奏、lookahead scheduling) ----------
let step = 0, nextTime = 0, timer = null, paused = false, barStepDone = -1, kickCount = 0;
function curPattern() { const p = PATTERNS[state.pattern]; return p.steps ? p : (state.drums ? PATTERNS[state.drumPat] : p); }   // 手弾き + ドラム ON ならドラムパターンで回す
function stepDur() { const p = curPattern(); return (60 / state.bpm) / (p.steps.length / p.beats); }
function tick() {
  while (!paused && nextTime < ac.currentTime + 0.15) {
    const p = curPattern(), drumOnly = !PATTERNS[state.pattern].steps;
    if (!p.steps) { nextTime = ac.currentTime + 0.1; break; }
    if (step % p.steps.length === 0 && step !== barStepDone) { barStepDone = step; kickCount = 0; }
    const dr = p.steps[step % p.steps.length], t = nextTime;
    const ev = p.strum ? { ...dr, ...STRUMS[state.strum].steps[step % 16] } : dr;   // ストローク系はコードの D/U を弾き方で置き換える
    const v = state.vel * (ev.acc ? 1 : 0.8);
    if (dr.k) drum('k', t + jitter(0.004), hVel(v));
    if (dr.s) drum('s', t + jitter(0.006), hVel(v)); if (dr.h) drum('h', t + jitter(0.008), hVel(v * 0.9));
    if (drumOnly) { step++; nextTime += stepDur(); continue; }       // ドラムだけ。コードは手弾き
    bassStep(step % p.steps.length, p, dr, t, v);
    const dur = stepDur() * (ev.a !== undefined ? 4 : 2.5);
    if (ev.d) strum(state.chord, t, 'd', v, dur);
    if (ev.u) strum(state.chord, t, 'u', v, dur);
    if (ev.a !== undefined) arp(state.chord, ev.a, t, v, dur);
    if (state.chord && (ev.d || ev.u || ev.a !== undefined)) flashButtons(t);
    step++; nextTime += stepDur();
  }
}
function startSeq(keepHeld) { if (!keepHeld) stopHeld(ac.currentTime); if (timer) return; step = 0; barStepDone = -1; paused = false; nextTime = ac.currentTime + 0.05; timer = setInterval(tick, 25); }
function stopSeq() { clearInterval(timer); timer = null; paused = false; stopHeld(ac.currentTime); midi.allOff(); }
function stopTimer() { clearInterval(timer); timer = null; paused = false; }
function setDrums(on) {
  state.drums = on; document.getElementById('drumBtn').classList.toggle('on', on);
  if (state.pattern !== 'manual') return;            // 自動演奏中はパターン側のドラムが鳴る
  if (on) startSeq(true); else stopTimer();
}
function setDrumPat(id) { state.drumPat = id; document.getElementById('drumPatSel').value = id; savePref('drumPat', id); }
// 音が鳴る瞬間に現在の度数ボタン (と修飾ボタン) を光らせる。〜 は光らせない (押している間だけ点く)
const flashTimers = new Map();
function flashButtons(t = ac.currentTime) {
  const els = [document.querySelector('.deg[data-deg].on'), document.querySelector('.mod.on')].filter(Boolean);
  setTimeout(() => els.forEach(el => {
    el.classList.add('hit'); clearTimeout(flashTimers.get(el));
    flashTimers.set(el, setTimeout(() => el.classList.remove('hit'), 90));
  }), Math.max(0, (t - ac.currentTime) * 1000));
}

// ---------- UI ----------
document.getElementById('keyDown').onclick = () => setKey(state.key - 1);
document.getElementById('keyUp').onclick = () => setKey(state.key + 1);
const sel = document.getElementById('instSel');
for (const [id, v] of Object.entries(INSTRUMENTS)) sel.add(new Option(v.label, id));
sel.onchange = () => loadInstrument(sel.value);
document.getElementById('instName').onclick = () => { const ids = Object.keys(INSTRUMENTS); loadInstrument(ids[(ids.indexOf(instId) + 1) % ids.length]); };

for (const [id, v] of Object.entries(ARPEGGIOS)) document.getElementById('arpSel').add(new Option(v.label, id));
for (const [id, v] of Object.entries(BASSES)) document.getElementById('bassSel').add(new Option(v.label, id));
for (const [id, v] of Object.entries(STRUMS)) document.getElementById('strumSel').add(new Option(v.label, id));
document.getElementById('strumSel').onchange = e => setStrum(e.target.value);
document.getElementById('arpSel').onchange = e => setArp(e.target.value);
document.getElementById('bassSel').onchange = e => setBass(e.target.value);
for (const [id, v] of Object.entries(BASS_PROGRAMS)) document.getElementById('bassProgSel').add(new Option(v.label, id));
for (const [id, v] of Object.entries(BASS_STYLES)) document.getElementById('bassStyleSel').add(new Option(v.label, id));
document.getElementById('bassProgSel').onchange = e => setBassProg(e.target.value);
document.getElementById('bassStyleSel').onchange = e => setBassStyle(e.target.value);
document.getElementById('bassOctSel').onchange = e => setBassOct(+e.target.value);
document.getElementById('bpmSl').oninput = e => setBpm(+e.target.value);
for (const [id, p] of Object.entries(PATTERNS)) if (p.steps) document.getElementById('drumPatSel').add(new Option(p.label, id));
document.getElementById('drumPatSel').onchange = e => setDrumPat(e.target.value);
document.getElementById('drumBtn').onclick = () => { ac.resume(); setDrums(!state.drums); };
document.getElementById('octSel').onchange = e => setOctave(+e.target.value);
const patrow = document.getElementById('patrow');
for (const [id, p] of Object.entries(PATTERNS)) {
  const el = document.createElement('div'); el.className = 'pat'; el.dataset.pat = id;
  const dots = (p.steps || []).slice(0, 16).map(e => `<i class="${e.d || e.u || e.a !== undefined ? 'on' : ''}"></i>`).join('');
  el.innerHTML = `<div class="dots">${dots}</div>${p.label}`;
  el.onclick = () => { ac.resume(); setPattern(id); if (id === 'manual') { stopSeq(); if (state.drums) startSeq(true); } else startSeq(); };
  patrow.appendChild(el);
}
// コードボタン: 押す / 離す の両方でアルペジオが進む (本家と同じ)
document.querySelectorAll('.deg[data-deg]').forEach(b => {
  const d = +b.dataset.deg;
  b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); pressDeg(d); });
  ['pointerup', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => releaseDeg(d)));
});
// ♭ / ♯ / 修飾: 画面のボタンはトグル (マウスでも使えるように)。キーボードは本家と同じく押している間だけ
document.querySelectorAll('.deg.shift').forEach(b => b.addEventListener('pointerdown', () => setShift(state.shift === +b.dataset.shift ? 0 : +b.dataset.shift)));
document.querySelectorAll('.mod').forEach(b => b.addEventListener('pointerdown', () => setMod(state.mod === b.dataset.mod ? null : b.dataset.mod)));
// 〜 = 押している間メジャー↔マイナー入れ替え (本家の Swap)
const pad = document.getElementById('pad');
pad.addEventListener('pointerdown', e => { pad.setPointerCapture(e.pointerId); ac.resume(); setSwap(true); });
['pointerup', 'pointercancel'].forEach(ev => pad.addEventListener(ev, () => setSwap(false)));

// キーボード: 本家 KANTAN Play online の ShortCutKeys と同じ割り当て (押す / 離す両方を見る)
//   1〜7 / テンキー / Z X C (1 2 3) A S D (4 5 6) Q W E (7 8 9)   8 = ♭  9 = ♯ (押している間)
//   0 = 〜 (押している間メジャー↔マイナー)   V B N M , = dim sus4 add9 7 M7 (押している間)
//   - = キー下げ  = / + = キー上げ   F1〜F5 = アルペジオ選択   Space = ストローク (クローン独自)
const KEYMAP = {
  '1': ['deg', 1], 'z': ['deg', 1], '2': ['deg', 2], 'x': ['deg', 2], '3': ['deg', 3], 'c': ['deg', 3],
  '4': ['deg', 4], 'a': ['deg', 4], '5': ['deg', 5], 's': ['deg', 5], '6': ['deg', 6], 'd': ['deg', 6],
  '7': ['deg', 7], 'q': ['deg', 7], '8': ['shift', -1], 'w': ['shift', -1], '9': ['shift', 1], 'e': ['shift', 1],
  '0': ['swap'], ' ': ['strum'], '-': ['key', -1], '=': ['key', 1], '+': ['key', 1],
  'v': ['mod', 'dim'], 'b': ['mod', 'sus4'], 'n': ['mod', '9'], 'm': ['mod', '7'], ',': ['mod', 'M7'],
  'f1': ['arp', 0], 'f2': ['arp', 1], 'f3': ['arp', 2], 'f4': ['arp', 3], 'f5': ['arp', 4],
};
window.addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  const a = KEYMAP[e.key.toLowerCase()]; if (!a) return;
  e.preventDefault(); ac.resume();
  switch (a[0]) {
    case 'deg':   pressDeg(a[1]); break;
    case 'shift': setShift(a[1]); break;
    case 'mod':   setMod(a[1]); break;
    case 'swap':  setSwap(true); break;
    case 'key':   setKey(state.key + a[1]); break;
    case 'arp':   changeArp(a[1]); break;
    case 'strum': strum(state.chord, ac.currentTime, 'd', state.vel, 2); flashButtons(); break;
  }
});
window.addEventListener('keyup', e => {
  const a = KEYMAP[e.key.toLowerCase()]; if (!a) return;
  switch (a[0]) {
    case 'deg':   releaseDeg(a[1]); break;
    case 'shift': if (state.shift === a[1]) setShift(0); break;
    case 'mod':   if (state.mod === a[1]) setMod(null); break;
    case 'swap':  setSwap(false); break;
  }
});
window.addEventListener('blur', () => { pressed.forEach(d => releaseDeg(d)); setSwap(false); });

// 保存した設定 (キー / テンポ / オクターブ / 各セレクト / 楽器 / アルペジオ番号 / MIDI ポート) で復元
state.key = prefs.key ?? 0; renderKey(); setPattern('manual');
setBpm(prefs.bpm ?? 100); setArp(ARPEGGIOS[prefs.arp] ? prefs.arp : 'updown'); setBass(BASSES[prefs.bass] ? prefs.bass : 'alt');
setStrum(STRUMS[prefs.strum] ? prefs.strum : 'folk'); setOctave(prefs.octave ?? 0);
state.bassProg = BASS_PROGRAMS[prefs.bassProg] ? prefs.bassProg : 'acoustic'; document.getElementById('bassProgSel').value = state.bassProg;
setBassStyle(BASS_STYLES[prefs.bassStyle] ? prefs.bassStyle : 'root'); setBassOct(prefs.bassOct ?? 0);
setDrumPat(PATTERNS[prefs.drumPat] && PATTERNS[prefs.drumPat].steps ? prefs.drumPat : 'eight');
arpEng.cur = prefs.arpNo ?? 0;
loadInstrument(INSTRUMENTS[prefs.instrument] ? prefs.instrument : 'guitar'); loadBass(); initMidi();
</script>
</body>
</html>
